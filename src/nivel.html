<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Classificação de Heróis</title>
</head>
<body>

    <h1>Classificação de Heróis</h1>
    <div id="resultado"></div>

    <script>
        const herois = [
            { nome: "Arthur", xp: 950 },
            { nome: "Jaina", xp: 1500 },
            { nome: "Uther", xp: 3500 },
            { nome: "Sylvanas", xp: 6500 },
            { nome: "Valeera", xp: 7200 },
            { nome: "Illidan", xp: 8800 },
            { nome: "Gul'dan", xp: 9999 },
            { nome: "Medivh", xp: 15000 }
        ];

        let resultado = document.getElementById("resultado");

        for (let i = 0; i < herois.length; i++) {
            let nome = herois[i].nome;
            let xp = herois[i].xp;
            let nivel = "";

            if (xp <= 1000) {
                nivel = "Ferro";
            } else if (xp <= 2000) {
                nivel = "Bronze";
            } else if (xp <= 5000) {
                nivel = "Prata";
            } else if (xp <= 7000) { 
                nivel = "Ouro";
            } else if (xp <= 8000) {
                nivel = "Platina";
            } else if (xp <= 9000) {
                nivel = "Ascendente";
            } else if (xp <= 10000) {
                nivel = "Imortal";
            } else {
                nivel = "Radiante";
            }

            resultado.innerHTML += `<p>O Herói de nome ${nome} está no nível de ${nivel}</p>`;
        }
    </script>

</body>
</html>
